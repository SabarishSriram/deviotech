<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1754 1240" width="1754" height="1240" role="img" aria-label="Devvy Tech Certificate of Completion">
  <title>Devvy Tech — Certificate of Completion (A4 landscape)</title>
  <!-- Replace the {{PLACEHOLDERS}}: STUDENT_NAME, TRACK, PROJECT, ISSUE_DATE, CERT_ID -->
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#0a0a0a" opacity="0.07" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A33" stop-opacity="0.16" /><stop offset="100%" stop-color="#FF2A33" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2A33" /><stop offset="100%" stop-color="#D11A22" />
    </linearGradient>
  </defs>
  <style>
    .m{font-family:'Geist Mono','JetBrains Mono',ui-monospace,Menlo,monospace}
    .s{font-family:'Geist','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif}
    .lbl{font-family:'Geist Mono','JetBrains Mono',ui-monospace,Menlo,monospace;font-size:19px;letter-spacing:5px;fill:#737373}
  </style>

  <rect width="1754" height="1240" fill="#fafafa" />
  <rect width="1754" height="1240" fill="url(#dots)" />
  <circle cx="1500" cy="160" r="520" fill="url(#glow)" />
  <circle cx="200" cy="1100" r="420" fill="url(#glow)" />

  <!-- frame -->
  <rect x="48" y="48" width="1658" height="1144" rx="28" fill="#fff" stroke="#0a0a0a" stroke-width="3" />
  <rect x="68" y="68" width="1618" height="1104" rx="18" fill="none" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="4 8" />
  <!-- red left spine -->
  <rect x="48" y="48" width="26" height="1144" rx="13" fill="url(#band)" />
  <!-- corner terminal prompts -->
  <g class="m" font-size="26" font-weight="700" fill="#FF2A33">
    <text x="118" y="128">&gt;_</text><text x="1590" y="128">&gt;_</text>
  </g>

  <!-- brand -->
  <g transform="translate(160,120) scale(2)">
    <rect width="32" height="32" rx="8" fill="#FF2A33" />
    <path d="M10 11l5 5-5 5M17 21h6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="240" y="170" class="s" font-size="48" font-weight="600" fill="#0a0a0a" letter-spacing="-1">Devvy Tech</text>
  <text x="1594" y="168" text-anchor="end" class="lbl">PROJECT INTERNSHIP PROGRAM</text>

  <!-- title -->
  <text x="877" y="360" text-anchor="middle" class="lbl" font-size="22">// CERTIFICATE OF COMPLETION</text>
  <text x="877" y="470" text-anchor="middle" class="s" font-size="84" font-weight="800" fill="#0a0a0a" letter-spacing="-3">Built it. Shipped it.<tspan fill="#FF2A33">.</tspan></text>

  <text x="877" y="560" text-anchor="middle" class="s" font-size="28" fill="#525252">This certifies that</text>

  <!-- name -->
  <text x="877" y="680" text-anchor="middle" class="s" font-size="104" font-weight="700" fill="#0a0a0a" letter-spacing="-3">{{STUDENT_NAME}}</text>
  <rect x="427" y="710" width="900" height="3" fill="#0a0a0a" />
  <circle cx="1327" cy="711.5" r="9" fill="#FF2A33" />

  <text x="877" y="775" text-anchor="middle" class="s" font-size="28" fill="#525252">has successfully completed the 4-week Devvy Tech project internship in</text>
  <text x="877" y="838" text-anchor="middle" class="m" font-size="40" font-weight="700" fill="#D11A22">{{TRACK}}</text>
  <text x="877" y="890" text-anchor="middle" class="s" font-size="26" fill="#525252">by designing, building and shipping <tspan font-weight="700" fill="#0a0a0a">{{PROJECT}}</tspan>,</text>
  <text x="877" y="928" text-anchor="middle" class="s" font-size="26" fill="#525252">with mentor code reviews and AI-assisted engineering.</text>

  <!-- footer row -->
  <line x1="160" y1="1010" x2="1594" y2="1010" stroke="#e5e5e5" stroke-width="2" />

  <g>
    <text x="160" y="1062" class="lbl" font-size="15">ISSUED ON</text>
    <text x="160" y="1110" class="m" font-size="30" font-weight="600" fill="#0a0a0a">{{ISSUE_DATE}}</text>
  </g>

  <!-- signature -->
  <g>
    <path d="M560 1085c18-30 30-8 42-18s10 28 30 4 22-10 40 6" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" />
    <line x1="540" y1="1100" x2="800" y2="1100" stroke="#0a0a0a" stroke-width="2" />
    <text x="540" y="1136" class="lbl" font-size="15">PROGRAM MENTOR</text>
  </g>

  <!-- seal -->
  <g transform="translate(877,1075)">
    <circle r="86" fill="#FF2A33" opacity="0.1" />
    <circle r="70" fill="#FF2A33" />
    <circle r="60" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 6" />
    <path d="M-22 -6l14 14-14 14M2 22h22" transform="translate(0,-2)" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
  </g>

  <!-- QR + id -->
  <g transform="translate(1394,1030)" fill="#0a0a0a">
    <rect width="120" height="120" rx="10" fill="#fff" stroke="#0a0a0a" stroke-width="3" />
    <rect x="16" y="16" width="30" height="30" /><rect x="74" y="16" width="30" height="30" /><rect x="16" y="74" width="30" height="30" />
    <rect x="22" y="22" width="18" height="18" fill="#fff" /><rect x="80" y="22" width="18" height="18" fill="#fff" /><rect x="22" y="80" width="18" height="18" fill="#fff" />
    <rect x="27" y="27" width="8" height="8" /><rect x="85" y="27" width="8" height="8" /><rect x="27" y="85" width="8" height="8" />
    <rect x="58" y="58" width="12" height="12" /><rect x="78" y="74" width="12" height="12" /><rect x="94" y="92" width="10" height="10" /><rect x="60" y="88" width="10" height="10" />
    <text x="-24" y="42" text-anchor="end" class="lbl" font-size="15" fill="#737373">CERTIFICATE ID</text>
    <text x="-24" y="80" text-anchor="end" class="m" font-size="30" font-weight="700" fill="#0a0a0a">{{CERT_ID}}</text>
    <text x="-24" y="110" text-anchor="end" class="m" font-size="18" fill="#D11A22">deviotech.in/verify</text>
  </g>
</svg>
